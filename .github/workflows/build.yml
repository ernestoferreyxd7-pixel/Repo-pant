name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Armar proyecto
        run: |
          D=src/main/java/com/sefixz/scorpysafio
          R=src/main/resources
          mkdir -p $D/mixin $R/assets/scorpysafio/textures/gui
          [ -f ScorpyTitleScreen.java ] && mv ScorpyTitleScreen.java Batch.java $D/ || true
          [ -f MinecraftClientMixin.java ] && mv MinecraftClientMixin.java $D/mixin/ || true
          [ -f fabric.mod.json ] && mv fabric.mod.json scorpysafio.mixins.json $R/ || true
          [ -f logo.png ] && mv logo.png logo.png.mcmeta $R/assets/scorpysafio/textures/gui/ || true

      - name: Compilar
        run: gradle build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: scorpysafio-mod
          path: build/libs/*.jar
